name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekday mornings (UTC) so changes on the tested site are noticed quickly.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run the suite
        run: npm test
      - name: Upload report and JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/junit.xml
          retention-days: 14
